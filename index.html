<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Detectives</title>
<style>
  :root {
    --ink: #1d2330;
    --muted: #5b6678;
    --accent: #2557a7;
    --accent2: #e8632a;
    --bg: #f4f6fb;
    --card: #ffffff;
    --line: #d3dae8;
    --soft: #eef3fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    line-height: 1.45;
    padding: 0 16px 40px;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
  }
  header {
    background: var(--accent);
    color: white;
    border-radius: 0 0 18px 18px;
    margin-bottom: 22px;
  }
  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 26px 18px 28px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 4vw, 2.7rem);
  }
  .tag {
    margin: 0;
    opacity: 0.95;
    font-size: 1.05rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin: 16px 0;
  }
  h2 {
    margin-top: 0;
    color: var(--accent);
    font-size: clamp(1.3rem, 2vw, 1.7rem);
  }
  .link-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 12px;
  }
  .link-box {
    border: 1px solid var(--line);
    background: var(--soft);
    border-radius: 12px;
    padding: 16px;
  }
  .link-box strong {
    display: block;
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: var(--accent2);
  }
  a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
  }
  a:hover {
    text-decoration: underline;
  }
  .meta {
    color: var(--muted);
    margin-top: 10px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    margin-top: 28px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🔎 Data Detectives</h1>
      <p class="tag">Student Project Guide and Workbook</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>Choose a page</h2>
      <div class="link-grid">
        <div class="link-box">
          <strong>Project Guide</strong>
          <a href="./data_detectives_project_guide.html">Open Project Guide</a>
        </div>
        <div class="link-box">
          <strong>Data Workbook</strong>
          <a href="./data_detectives_workbook.html">Open Data Workbook</a>
        </div>
      </div>
      <p class="meta">Use this landing page to share one link with the student.</p>
    </section>
  </main>

  <footer>
    Data Detectives · Talcott Mountain Academy · Pre-Algebra
  </footer>
</body>
</html>
